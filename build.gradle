plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
}

// 실행 가능한 jar 하나만 만들고, 이름을 고정 (워크플로에서 찾기 쉽게)
bootJar {
    archiveFileName = 'ci-demo.jar'
}

// 실행할 수 없는 -plain.jar 는 만들지 않음
jar {
    enabled = false
}
