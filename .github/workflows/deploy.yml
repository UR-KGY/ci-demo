name: Deploy ci-demo to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ① 코드 받기
      - name: Checkout
        uses: actions/checkout@v4

      # ② Java 21 설치 + 빌드 (CI)
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: gradle

      - name: Build jar
        run: |
          chmod +x gradlew
          ./gradlew clean bootJar
          cp build/libs/ci-demo.jar ci-demo.jar.new

      # ③ jar를 EC2로 복사 (CD)
      - name: Upload jar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          source: ci-demo.jar.new
          target: /home/ec2-user

      # ④ EC2에서 이전 버전 종료 → 교체 → 실행
      #    PID 파일로 종료하므로 게임 서버(app.jar)에는 영향 없음
      - name: Restart app on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            if [ -f ~/ci-demo.pid ]; then
              kill "$(cat ~/ci-demo.pid)" 2>/dev/null || true
              sleep 3
            fi
            mv ~/ci-demo.jar.new ~/ci-demo.jar
            nohup java -Xmx256m -jar ~/ci-demo.jar --app.version=${{ github.sha }} \
              > ~/ci-demo.log 2>&1 < /dev/null &
            echo $! > ~/ci-demo.pid
            echo "started PID $(cat ~/ci-demo.pid)"

      # ⑤ 서버 응답 확인 (최대 2분)
      - name: Health check
        run: |
          for i in $(seq 1 12); do
            if curl -sf http://${{ secrets.EC2_HOST }}:8081/health; then
              echo ""; echo "배포 성공"
              curl -s http://${{ secrets.EC2_HOST }}:8081/
              exit 0
            fi
            echo "대기 중... ($i/12)"; sleep 10
          done
          echo "응답 없음: EC2에서 ~/ci-demo.log 확인"
          exit 1
