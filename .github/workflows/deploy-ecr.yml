name: Deploy ci-demo to EC2 (ECR)

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub OIDC 토큰을 발급받아 AWS IAM Role을 빌려 쓰기 위한 권한
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: ci-demo
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ① 코드 받기
      - name: Checkout
        uses: actions/checkout@v4

      # ② Java 21 설치 + jar 빌드
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: gradle

      - name: Build jar
        run: |
          chmod +x gradlew
          ./gradlew clean bootJar

      # ③ OIDC로 IAM Role 빌리기 (S3 방식과 동일)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ④ ECR 로그인 (registry 주소를 출력으로 받음)
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ⑤ ARM(t4g) EC2에서 실행할 수 있도록 linux/arm64 이미지 빌드 준비
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ⑥ 이미지 빌드 + ECR에 push (태그: 커밋 번호)
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          # SHA 태그(롤백용) + latest 태그(ASG가 새 서버를 만들 때 받을 이미지)
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      # ⑦ SSM으로 EC2에 "이미지 받아서 컨테이너 실행" 명령 전송
      - name: Deploy via SSM
        run: |
          # EC2에서 실행할 스크립트 (SSM은 root로 실행)
          cat > remote.sh <<EOF
          set -e
          REGISTRY=${{ steps.ecr.outputs.registry }}
          IMAGE=\$REGISTRY/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

          # ECR 로그인 후 이미지 받기
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin \$REGISTRY
          docker pull \$IMAGE

          # 이전 S3 방식으로 실행 중인 jar가 있으면 종료 (8081 포트 비우기)
          if [ -f /home/ec2-user/ci-demo.pid ]; then
            kill "\$(cat /home/ec2-user/ci-demo.pid)" 2>/dev/null || true
            rm -f /home/ec2-user/ci-demo.pid
            sleep 3
          fi

          # 이전 컨테이너 교체
          docker rm -f ci-demo 2>/dev/null || true
          docker run -d --name ci-demo --restart unless-stopped -p 8081:8081 \$IMAGE --app.version=${{ env.IMAGE_TAG }}

          # 사용하지 않는 이전 이미지 정리 (디스크 절약)
          docker image prune -af --filter "until=24h" || true

          docker ps --filter name=ci-demo --format "running: {{.Image}} ({{.Status}})"
          EOF

          PARAMS=$(jq -n --rawfile s remote.sh '{commands: [$s]}')

          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "ci-demo ecr ${{ env.IMAGE_TAG }}" \
            --parameters "$PARAMS" \
            --query "Command.CommandId" --output text)
          echo "SSM Command ID: $CMD_ID"

          sleep 3
          aws ssm wait command-executed \
            --command-id "$CMD_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" || true

          aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output yaml

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "Status" --output text)
          [ "$STATUS" = "Success" ] || { echo "SSM 명령 실패: $STATUS"; exit 1; }

      # ⑧ 서버 응답 확인 (최대 2분) — ALB(80) 경유
      #    EC2 8081은 ALB 보안 그룹에서만 열려 있으므로 Runner는 ALB DNS로 확인
      - name: Health check (via ALB)
        run: |
          for i in $(seq 1 12); do
            if curl -sf http://${{ secrets.ALB_DNS }}/health; then
              echo ""; echo "배포 성공"
              curl -s http://${{ secrets.ALB_DNS }}/
              exit 0
            fi
            echo "대기 중... ($i/12)"; sleep 10
          done
          echo "응답 없음: 대상 그룹 상태 / EC2에서 docker logs ci-demo 확인"
          exit 1
