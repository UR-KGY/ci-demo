name: Deploy ci-demo to ASG (ECR)

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub OIDC 토큰을 발급받아 AWS IAM Role을 빌려 쓰기 위한 권한
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: ci-demo
  IMAGE_TAG: ${{ github.sha }}
  ASG_NAME: ci-demo-asg

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ① 코드 받기
      - name: Checkout
        uses: actions/checkout@v4

      # ② Java 21 설치 + jar 빌드
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: gradle

      - name: Build jar
        run: |
          chmod +x gradlew
          ./gradlew clean bootJar

      # ③ OIDC로 IAM Role 빌리기
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ④ ECR 로그인 (registry 주소를 출력으로 받음)
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ⑤ ARM(t4g) EC2에서 실행할 수 있도록 linux/arm64 이미지 빌드 준비
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ⑥ 이미지 빌드 + ECR에 push
      #    SHA 태그(롤백용) + latest 태그(ASG가 새 서버를 만들 때 받을 이미지)
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      # ⑦ 배포 대상 찾기: ASG에서 현재 InService인 서버 목록
      #    (서버가 교체되어 ID가 바뀌어도 매번 새로 조회하므로 항상 최신 목록)
      - name: Find ASG instances
        id: targets
        run: |
          IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$ASG_NAME" \
            --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService'].InstanceId" \
            --output text)
          [ -n "$IDS" ] || { echo "InService 인스턴스 없음"; exit 1; }
          echo "배포 대상: $IDS"
          echo "ids=$IDS" >> "$GITHUB_OUTPUT"

      # ⑧ SSM으로 모든 서버에 배포 (한 대씩 순서대로 = 롤링 배포)
      - name: Deploy via SSM (rolling)
        run: |
          # 각 서버에서 실행할 스크립트 (SSM은 root로 실행)
          cat > remote.sh <<EOF
          set -e
          REGISTRY=${{ steps.ecr.outputs.registry }}
          IMAGE=\$REGISTRY/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

          # ECR 로그인 후 이미지 받기
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin \$REGISTRY
          docker pull \$IMAGE

          # 컨테이너 교체
          docker rm -f ci-demo 2>/dev/null || true
          docker run -d --name ci-demo --restart unless-stopped -p 8081:8081 \$IMAGE --app.version=${{ env.IMAGE_TAG }}

          # 이 서버의 앱이 실제로 뜰 때까지 대기 (최대 3분)
          # → 이게 끝나야 SSM이 다음 서버로 넘어감 = 두 서버가 동시에 내려가지 않음
          for i in \$(seq 1 36); do
            if curl -sf localhost:8081/health > /dev/null; then echo "healthy after \$((i*5))s"; break; fi
            sleep 5
          done
          curl -sf localhost:8081/health > /dev/null || { echo "앱 기동 실패"; docker logs --tail 50 ci-demo; exit 1; }

          # 사용하지 않는 이전 이미지 정리
          docker image prune -af --filter "until=24h" || true
          docker ps --filter name=ci-demo --format "running: {{.Image}} ({{.Status}})"
          EOF

          PARAMS=$(jq -n --rawfile s remote.sh '{commands: [$s]}')

          # --max-concurrency 1  : 한 번에 1대씩
          # --max-errors 0       : 1대라도 실패하면 나머지 중단
          CMD_ID=$(aws ssm send-command \
            --instance-ids ${{ steps.targets.outputs.ids }} \
            --document-name "AWS-RunShellScript" \
            --comment "ci-demo asg ${{ env.IMAGE_TAG }}" \
            --max-concurrency 1 \
            --max-errors 0 \
            --parameters "$PARAMS" \
            --query "Command.CommandId" --output text)
          echo "SSM Command ID: $CMD_ID"

          # 전체 명령 완료 대기 (최대 10분)
          for i in $(seq 1 60); do
            STATUS=$(aws ssm list-commands --command-id "$CMD_ID" \
              --query "Commands[0].Status" --output text)
            echo "상태: $STATUS ($i)"
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done

          # 서버별 결과 출력
          aws ssm list-command-invocations --command-id "$CMD_ID" --details \
            --query "CommandInvocations[].{Instance:InstanceId,Status:Status,Output:CommandPlugins[0].Output}" \
            --output yaml

          [ "$STATUS" = "Success" ] || { echo "SSM 명령 실패: $STATUS"; exit 1; }

      # ⑨ ALB 경유 응답 확인
      - name: Health check (via ALB)
        run: |
          for i in $(seq 1 12); do
            if curl -sf http://${{ secrets.ALB_DNS }}/health; then
              echo ""; echo "배포 성공"
              for j in 1 2 3 4; do curl -s http://${{ secrets.ALB_DNS }}/; echo; done
              exit 0
            fi
            echo "대기 중... ($i/12)"; sleep 10
          done
          echo "응답 없음: 대상 그룹 상태 / 각 서버 docker logs ci-demo 확인"
          exit 1
